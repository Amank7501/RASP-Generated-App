server:
  port: 8086
spring:
  application:
    name: app
  datasource:
    url: jdbc:mysql://localhost:3306/app
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  security:
    corse:
      allowed-origins: ${CORS_ALLOWED_ORIGINS} # e.g., http://localhost:3000
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${CLIENT_ID}
            client-secret: ${CLIENT_SECRET}
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_SERVER_URL}/realms/${REALM}
            authorization-uri: ${KEYCLOAK_SERVER_URL}/realms/${REALM}/protocol/openid-connect/auth
            token-uri: ${KEYCLOAK_SERVER_URL}/realms/${REALM}/protocol/openid-connect/token
            user-info-uri: ${KEYCLOAK_SERVER_URL}/realms/${REALM}/protocol/openid-connect/userinfo
            jwk-set-uri: ${KEYCLOAK_SERVER_URL}/realms/${REALM}/protocol/openid-connect/certs
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_SERVER_URL}/realms/${REALM}
          jwk-set-uri: ${KEYCLOAK_SERVER_URL}/realms/${REALM}/protocol/openid-connect/certs
        opaquetoken:
          introspection-uri: ${KEYCLOAK_SERVER_URL}/realms/${REALM}/protocol/openid-connect/token/introspect
          client-id: ${CLIENT_ID}
          client-secret: ${CLIENT_SECRET}

keycloak:
  default-role: USER
  roles: USER,ADMIN
  auth-server-url: ${KEYCLOAK_SERVER_URL}
  realm: ${REALM}
  client-id: ${CLIENT_ID}
  client-secret: ${CLIENT_SECRET}
  admin:
    client-secret: ${CLIENT_SECRET}

app:
  entity-package: com.example.app.entity